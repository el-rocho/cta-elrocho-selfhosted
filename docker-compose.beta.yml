services:
  control-tension-server-beta:
    image: ghcr.io/el-rocho/cta-elrocho-selfhosted:beta
    container_name: control-tension-server-beta
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./data-beta:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/auth/status', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
