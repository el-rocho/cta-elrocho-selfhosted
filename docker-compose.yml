services:
  control-tension-server:
    image: ${CTA_IMAGE:-ghcr.io/el-rocho/cta-elrocho-selfhosted:latest}
    container_name: control-tension-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s


